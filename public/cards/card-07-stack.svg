<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-stack" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#0a1a1f" stop-opacity="1" />
      <stop offset="50%" stop-color="#050d12" stop-opacity="1" />
      <stop offset="100%" stop-color="#020406" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="stack-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#00b4d8" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#64748b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="orbital-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#00ffcc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0.3" />
    </linearGradient>

    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
    </filter>

    <pattern id="grid-stk" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="560" height="800" fill="url(#bg-stack)" />
  <rect width="560" height="800" fill="url(#grid-stk)" />

  <!-- Ambient Light -->
  <circle cx="280" cy="340" r="180" fill="url(#stack-core-glow)" filter="url(#glow-heavy)" opacity="0.65" />

  <!-- Radar / Global Communication Rings -->
  <g opacity="0.25">
    <circle cx="280" cy="340" r="220" fill="none" stroke="#00ffcc" stroke-width="1" stroke-dasharray="2 12" />
    <circle cx="280" cy="340" r="170" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="6 6" />
    <circle cx="280" cy="340" r="120" fill="none" stroke="#00b4d8" stroke-width="0.5" stroke-dasharray="1 4" />
  </g>

  <!-- Precision Technical Reticle -->
  <g opacity="0.3" stroke="#00ffcc" stroke-width="1">
    <line x1="280" y1="90" x2="280" y2="120" />
    <line x1="280" y1="560" x2="280" y2="590" />
    <line x1="50" y1="340" x2="80" y2="340" />
    <line x1="480" y1="340" x2="510" y2="340" />
  </g>

  <!-- Central Motif: Holographic Cybernetic Globe / Network Constellation -->
  <g transform="translate(280, 340)">
    <!-- Globe Outer Boundary -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#00ffcc" stroke-width="1.8" opacity="0.8" />
    <circle cx="0" cy="0" r="105" fill="rgba(0,255,204,0.03)" />

    <!-- Latitudinal Lines (Parallels) -->
    <ellipse cx="0" cy="0" rx="105" ry="32" fill="none" stroke="#00ffcc" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.6" />
    <ellipse cx="0" cy="-55" rx="89" ry="22" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.4" />
    <ellipse cx="0" cy="55" rx="89" ry="22" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.4" />

    <!-- Longitudinal Lines (Meridians) -->
    <ellipse cx="0" cy="0" rx="35" ry="105" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="72" ry="105" fill="none" stroke="#00ffcc" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.45" />
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#ffffff" stroke-width="1" opacity="0.5" />
    <line x1="-105" y1="0" x2="105" y2="0" stroke="#00ffcc" stroke-width="1.2" opacity="0.7" />

    <!-- Outer Orbital Comm Track -->
    <ellipse rx="155" ry="58" fill="none" stroke="url(#orbital-grad)" stroke-width="1.5" transform="rotate(-30)" />
    <!-- Orbiting Satellite Node 1 -->
    <circle cx="-135" cy="78" r="5" fill="#00ffcc" filter="url(#glow-soft)" />
    <circle cx="-135" cy="78" r="2.5" fill="#ffffff" />
    <!-- Orbiting Satellite Node 2 -->
    <circle cx="135" cy="-78" r="4.5" fill="#00e5ff" filter="url(#glow-soft)" />
    <circle cx="135" cy="-78" r="2" fill="#ffffff" />

    <!-- Global Network Hub Points on Globe -->
    <circle cx="-35" cy="-30" r="4.5" fill="#00ffcc" filter="url(#glow-soft)" />
    <circle cx="-35" cy="-30" r="2" fill="#ffffff" />

    <circle cx="45" cy="-20" r="5" fill="#00ffcc" filter="url(#glow-soft)" />
    <circle cx="45" cy="-20" r="2.5" fill="#ffffff" />

    <circle cx="10" cy="40" r="5" fill="#00e5ff" filter="url(#glow-soft)" />
    <circle cx="10" cy="40" r="2.5" fill="#ffffff" />

    <circle cx="-60" cy="20" r="4" fill="#ffffff" filter="url(#glow-soft)" />
    <circle cx="70" cy="30" r="4" fill="#ffffff" filter="url(#glow-soft)" />

    <!-- Inter-Hub Arc Vectors -->
    <path d="M -35 -30 Q 5 -50 45 -20" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8" />
    <path d="M 45 -20 Q 35 15 10 40" fill="none" stroke="#00ffcc" stroke-width="1.2" opacity="0.8" />
    <path d="M -60 20 Q -25 35 10 40" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.7" />

    <!-- Center Tech Beacon Ping -->
    <circle cx="0" cy="0" r="16" fill="rgba(0,255,204,0.15)" stroke="#00ffcc" stroke-width="1.5" />
    <circle cx="0" cy="0" r="6" fill="#00ffcc" filter="url(#glow-soft)" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />

    <!-- Minimalist CLI / Terminal Signal Badge `>_` -->
    <g transform="translate(0, 0)" opacity="0.9">
      <!-- Subtle Floating Terminal icon above core -->
      <g transform="translate(0, -65)">
        <rect x="-18" y="-12" width="36" height="24" rx="4" fill="#040c10" stroke="#00ffcc" stroke-width="1" />
        <path d="M -11 -3 L -7 0 L -11 3" fill="none" stroke="#00ffcc" stroke-width="1.2" stroke-linecap="round" />
        <line x1="-4" y1="3" x2="4" y2="3" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
      </g>
    </g>
  </g>

  <!-- Bottom Vignette -->
  <rect y="520" width="560" height="280" fill="url(#bg-stack)" opacity="0.85" />
</svg>
