<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-bigdata" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#071b1f" stop-opacity="1" />
      <stop offset="50%" stop-color="#040e13" stop-opacity="1" />
      <stop offset="100%" stop-color="#020406" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cluster-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4" />
    </linearGradient>

    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
    </filter>

    <pattern id="grid-bd" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="560" height="800" fill="url(#bg-bigdata)" />
  <rect width="560" height="800" fill="url(#grid-bd)" />

  <!-- Ambient Light -->
  <circle cx="280" cy="340" r="180" fill="url(#spark-glow)" filter="url(#glow-heavy)" opacity="0.6" />

  <!-- Spark Distributed Cluster Constellation Orbit -->
  <g opacity="0.25">
    <circle cx="280" cy="340" r="210" fill="none" stroke="#00ffcc" stroke-width="1" stroke-dasharray="2 12" />
    <circle cx="280" cy="340" r="160" fill="none" stroke="#06b6d4" stroke-width="0.75" stroke-dasharray="6 6" />
    <circle cx="280" cy="340" r="100" fill="none" stroke="#f59e0b" stroke-width="0.75" stroke-dasharray="4 8" opacity="0.6" />
  </g>

  <!-- Technical Reticle -->
  <g opacity="0.3" stroke="#00ffcc" stroke-width="1">
    <line x1="280" y1="90" x2="280" y2="120" />
    <line x1="280" y1="560" x2="280" y2="590" />
    <line x1="50" y1="340" x2="80" y2="340" />
    <line x1="480" y1="340" x2="510" y2="340" />
  </g>

  <!-- Central Motif: Apache Spark Starburst Node & Sharded Partition Matrix -->
  <g transform="translate(0, 0)">
    <!-- Interconnected Cluster Mesh Topology -->
    <g stroke="url(#cluster-beam)" stroke-width="1.2" opacity="0.7">
      <!-- Outer Node Connections to Center -->
      <line x1="280" y1="340" x2="170" y2="250" />
      <line x1="280" y1="340" x2="390" y2="250" />
      <line x1="280" y1="340" x2="150" y2="380" />
      <line x1="280" y1="340" x2="410" y2="380" />
      <line x1="280" y1="340" x2="220" y2="450" />
      <line x1="280" y1="340" x2="340" y2="450" />
      <line x1="280" y1="340" x2="280" y2="200" />

      <!-- Ring Interconnects between Workers -->
      <line x1="170" y1="250" x2="280" y2="200" stroke="#00ffcc" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 4" />
      <line x1="280" y1="200" x2="390" y2="250" stroke="#00ffcc" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 4" />
      <line x1="390" y1="250" x2="410" y2="380" stroke="#06b6d4" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 4" />
      <line x1="410" y1="380" x2="340" y2="450" stroke="#06b6d4" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 4" />
      <line x1="340" y1="450" x2="220" y2="450" stroke="#f59e0b" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 4" />
      <line x1="220" y1="450" x2="150" y2="380" stroke="#00ffcc" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 4" />
      <line x1="150" y1="380" x2="170" y2="250" stroke="#00ffcc" stroke-width="0.8" opacity="0.4" stroke-dasharray="2 4" />
    </g>

    <!-- Master Driver Core (Central Spark Starburst) -->
    <g transform="translate(280, 340)">
      <!-- Spark Star Rays -->
      <g stroke="#00ffcc" stroke-width="1.8" opacity="0.8">
        <line x1="0" y1="-32" x2="0" y2="32" />
        <line x1="-32" y1="0" x2="32" y2="0" />
        <line x1="-22" y1="-22" x2="22" y2="22" opacity="0.6" stroke-width="1.2" />
        <line x1="22" y1="-22" x2="-22" y2="22" opacity="0.6" stroke-width="1.2" />
      </g>
      <!-- Central Shard Cube / Core -->
      <circle cx="0" cy="0" r="22" fill="#030d12" stroke="#00ffcc" stroke-width="1.5" />
      <circle cx="0" cy="0" r="14" fill="#00ffcc" fill-opacity="0.2" filter="url(#glow-soft)" />
      <circle cx="0" cy="0" r="8" fill="#ffffff" />
      <circle cx="0" cy="0" r="4" fill="#00ffcc" />
    </g>

    <!-- Worker Nodes (Shards) -->
    <!-- Node 1: Top -->
    <g transform="translate(280, 200)">
      <circle cx="0" cy="0" r="12" fill="#051217" stroke="#00ffcc" stroke-width="1.2" />
      <circle cx="0" cy="0" r="5" fill="#00ffcc" filter="url(#glow-soft)" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>
    <!-- Node 2: Top Right -->
    <g transform="translate(390, 250)">
      <circle cx="0" cy="0" r="13" fill="#051217" stroke="#06b6d4" stroke-width="1.2" />
      <circle cx="0" cy="0" r="5.5" fill="#06b6d4" filter="url(#glow-soft)" />
      <circle cx="0" cy="0" r="2.2" fill="#ffffff" />
    </g>
    <!-- Node 3: Top Left -->
    <g transform="translate(170, 250)">
      <circle cx="0" cy="0" r="13" fill="#051217" stroke="#00ffcc" stroke-width="1.2" />
      <circle cx="0" cy="0" r="5.5" fill="#00ffcc" filter="url(#glow-soft)" />
      <circle cx="0" cy="0" r="2.2" fill="#ffffff" />
    </g>
    <!-- Node 4: Mid Right -->
    <g transform="translate(410, 380)">
      <circle cx="0" cy="0" r="14" fill="#051217" stroke="#00ffcc" stroke-width="1.2" />
      <circle cx="0" cy="0" r="6" fill="#00ffcc" filter="url(#glow-soft)" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
    <!-- Node 5: Mid Left -->
    <g transform="translate(150, 380)">
      <circle cx="0" cy="0" r="14" fill="#051217" stroke="#06b6d4" stroke-width="1.2" />
      <circle cx="0" cy="0" r="6" fill="#06b6d4" filter="url(#glow-soft)" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
    <!-- Node 6: Bottom Left -->
    <g transform="translate(220, 450)">
      <circle cx="0" cy="0" r="12" fill="#051217" stroke="#f59e0b" stroke-width="1.2" />
      <circle cx="0" cy="0" r="5" fill="#f59e0b" filter="url(#glow-soft)" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>
    <!-- Node 7: Bottom Right -->
    <g transform="translate(340, 450)">
      <circle cx="0" cy="0" r="12" fill="#051217" stroke="#00ffcc" stroke-width="1.2" />
      <circle cx="0" cy="0" r="5" fill="#00ffcc" filter="url(#glow-soft)" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>

    <!-- Moving Spark Particles (Data Shufflers) -->
    <circle cx="225" cy="295" r="3.5" fill="#ffffff" filter="url(#glow-soft)" />
    <circle cx="335" cy="295" r="3.5" fill="#00ffcc" filter="url(#glow-soft)" />
    <circle cx="345" cy="360" r="4" fill="#06b6d4" filter="url(#glow-soft)" />
    <circle cx="215" cy="360" r="4" fill="#f59e0b" filter="url(#glow-soft)" />
  </g>

  <!-- Bottom Vignette -->
  <rect y="520" width="560" height="280" fill="url(#bg-bigdata)" opacity="0.85" />
</svg>
