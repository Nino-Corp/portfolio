<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-pawrise" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#091b22" stop-opacity="1" />
      <stop offset="50%" stop-color="#050d12" stop-opacity="1" />
      <stop offset="100%" stop-color="#020406" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="pulse-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#00b4d8" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#0077b6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#00e5ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#00ffcc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
    </filter>

    <pattern id="grid-paw" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="560" height="800" fill="url(#bg-pawrise)" />
  <rect width="560" height="800" fill="url(#grid-paw)" />

  <!-- Ambient Light -->
  <circle cx="280" cy="340" r="180" fill="url(#pulse-glow)" filter="url(#glow-heavy)" opacity="0.6" />

  <!-- HUD Compass & IoT Frequency Rings -->
  <g opacity="0.25">
    <circle cx="280" cy="340" r="210" fill="none" stroke="#00ffcc" stroke-width="1" stroke-dasharray="2 10" />
    <circle cx="280" cy="340" r="160" fill="none" stroke="#00b4d8" stroke-width="0.75" stroke-dasharray="6 6" />
    <circle cx="280" cy="340" r="115" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="1 5" opacity="0.5" />
  </g>

  <!-- Precision Technical Markers -->
  <g opacity="0.3" stroke="#00ffcc" stroke-width="1">
    <line x1="280" y1="90" x2="280" y2="120" />
    <line x1="280" y1="560" x2="280" y2="590" />
    <line x1="50" y1="340" x2="80" y2="340" />
    <line x1="480" y1="340" x2="510" y2="340" />
  </g>

  <!-- Central Motif: Apple Health IoT Telemetry Pulse & Beacon -->
  <g transform="translate(0, 0)">
    <!-- Connected Collar Circular Halo (Isometric Horizon) -->
    <ellipse cx="280" cy="340" rx="140" ry="60" fill="none" stroke="#00ffcc" stroke-width="1.2" stroke-dasharray="4 8" opacity="0.4" />
    <ellipse cx="280" cy="340" rx="110" ry="46" fill="rgba(0,255,204,0.02)" stroke="#00b4d8" stroke-width="1.5" opacity="0.7" />

    <!-- Pulse Waveform Baseline (ECG Telemetry) -->
    <path d="M 60 340 
             L 170 340 
             L 190 325 
             L 205 355 
             L 220 340 
             L 245 340 
             L 260 250 
             L 280 430 
             L 300 280 
             L 315 365 
             L 330 340 
             L 355 340 
             L 370 320 
             L 385 340 
             L 500 340" 
          fill="none" 
          stroke="url(#wave-grad)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#glow-soft)" />

    <!-- Sharp Clean Foreground Trace -->
    <path d="M 60 340 
             L 170 340 
             L 190 325 
             L 205 355 
             L 220 340 
             L 245 340 
             L 260 250 
             L 280 430 
             L 300 280 
             L 315 365 
             L 330 340 
             L 355 340 
             L 370 320 
             L 385 340 
             L 500 340" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="1.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.9" />

    <!-- Anomaly Spike Indicator (Telemetry Point) -->
    <circle cx="280" cy="430" r="5" fill="#00ffcc" filter="url(#glow-soft)" />
    <circle cx="280" cy="430" r="2.5" fill="#ffffff" />
    <circle cx="260" cy="250" r="4" fill="#00e5ff" filter="url(#glow-soft)" />
    <circle cx="260" cy="250" r="2" fill="#ffffff" />

    <!-- Connected Beacon / Paw Sensor Glyph Core (Apple Stylized) -->
    <g transform="translate(280, 220)">
      <circle cx="0" cy="0" r="24" fill="#051016" stroke="#00ffcc" stroke-width="1.5" />
      <circle cx="0" cy="0" r="14" fill="#00ffcc" fill-opacity="0.15" />
      <!-- Minimalist Paw Silhouette in Vector Lines -->
      <ellipse cx="-5" cy="-4" rx="2.2" ry="3.2" fill="#00ffcc" />
      <ellipse cx="5" cy="-4" rx="2.2" ry="3.2" fill="#00ffcc" />
      <ellipse cx="-10" cy="1" rx="2" ry="2.8" fill="#00ffcc" />
      <ellipse cx="10" cy="1" rx="2" ry="2.8" fill="#00ffcc" />
      <path d="M -6 6 C -6 3 6 3 6 6 C 6 9 3 11 0 11 C -3 11 -6 9 -6 6 Z" fill="#00ffcc" />
      <!-- Pulsing Ping Waves -->
      <circle cx="0" cy="0" r="32" fill="none" stroke="#00ffcc" stroke-width="0.8" opacity="0.4" stroke-dasharray="3 6" />
    </g>
  </g>

  <!-- Bottom Vignette -->
  <rect y="520" width="560" height="280" fill="url(#bg-pawrise)" opacity="0.85" />
</svg>
