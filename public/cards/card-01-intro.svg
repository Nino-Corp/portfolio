<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#0a1a1f" stop-opacity="1" />
      <stop offset="50%" stop-color="#050c10" stop-opacity="1" />
      <stop offset="100%" stop-color="#020406" stop-opacity="1" />
    </radialGradient>

    <!-- Core Cyan Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#00e5ff" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#0077b6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Metallic Gradients -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#00ffcc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="ring-metal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00ffcc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Blur Filters -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="560" height="800" fill="url(#bg-glow)" />
  <rect width="560" height="800" fill="url(#grid)" />

  <!-- Ambient Light Sphere -->
  <circle cx="280" cy="340" r="180" fill="url(#core-glow)" filter="url(#glow-heavy)" opacity="0.65" />

  <!-- Background Radar / Optical Rings -->
  <g opacity="0.25">
    <circle cx="280" cy="340" r="220" fill="none" stroke="#00ffcc" stroke-width="1" stroke-dasharray="2 12" />
    <circle cx="280" cy="340" r="175" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="1 6" opacity="0.6" />
    <circle cx="280" cy="340" r="130" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="8 8" />
  </g>

  <!-- Tech Crosshairs & Apple Pro HUD Markings -->
  <g opacity="0.3" stroke="#00ffcc" stroke-width="1">
    <line x1="280" y1="80" x2="280" y2="110" />
    <line x1="280" y1="570" x2="280" y2="600" />
    <line x1="50" y1="340" x2="80" y2="340" />
    <line x1="480" y1="340" x2="510" y2="340" />
    <!-- Diagonal tick marks -->
    <circle cx="280" cy="340" r="240" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="1 80" />
  </g>

  <!-- Central Nexus: Gyroscopic Orbit Rings (Apple Style Quantum Core) -->
  <g transform="translate(280, 340)">
    <!-- Outer Ellipse 1 -->
    <ellipse rx="150" ry="55" fill="none" stroke="url(#cyan-grad)" stroke-width="2" transform="rotate(-28)" />
    <!-- Outer Ellipse 2 -->
    <ellipse rx="150" ry="55" fill="none" stroke="url(#ring-metal)" stroke-width="1.5" transform="rotate(32)" opacity="0.7" />
    <!-- Outer Ellipse 3 -->
    <ellipse rx="140" ry="48" fill="none" stroke="#00ffcc" stroke-width="1" stroke-dasharray="6 14" transform="rotate(78)" opacity="0.45" />

    <!-- Isometric Precision Octagon -->
    <polygon points="0,-70 50,-50 70,0 50,50 0,70 -50,50 -70,0 -50,-50" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.4" />
    <polygon points="0,-48 34,-34 48,0 34,34 0,48 -34,34 -48,0 -34,-34" fill="#00ffcc" fill-opacity="0.04" stroke="#00ffcc" stroke-width="1.8" />

    <!-- Luminous Central Silicon Core -->
    <circle cx="0" cy="0" r="30" fill="#00ffcc" fill-opacity="0.25" filter="url(#glow-soft)" />
    <circle cx="0" cy="0" r="18" fill="#ffffff" />
    <circle cx="0" cy="0" r="10" fill="#00ffcc" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />

    <!-- Orbital Energy Satellites / Nodes -->
    <circle cx="-132" cy="-70" r="4.5" fill="#00ffcc" filter="url(#glow-soft)" />
    <circle cx="-132" cy="-70" r="2" fill="#ffffff" />
    <line x1="-132" y1="-70" x2="-95" y2="-50" stroke="#00ffcc" stroke-width="0.8" opacity="0.6" stroke-dasharray="2 3" />

    <circle cx="125" cy="78" r="4" fill="#00e5ff" filter="url(#glow-soft)" />
    <circle cx="125" cy="78" r="1.8" fill="#ffffff" />
    <line x1="125" y1="78" x2="90" y2="55" stroke="#00e5ff" stroke-width="0.8" opacity="0.6" stroke-dasharray="2 3" />

    <circle cx="60" cy="-120" r="3" fill="#ffffff" opacity="0.9" />
    <circle cx="-80" cy="110" r="3" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Ambient Light Reflection on Top Left Edge -->
  <path d="M 0 0 L 220 0 C 140 60 60 140 0 220 Z" fill="#ffffff" fill-opacity="0.015" />

  <!-- Bottom Vignette for text contrast -->
  <rect y="520" width="560" height="280" fill="url(#bg-glow)" opacity="0.85" />
</svg>
